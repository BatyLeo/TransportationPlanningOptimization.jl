name: Benchmark
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  benchmark:
    name: Greedy benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.11'
      - uses: julia-actions/cache@v3
      - name: Instantiate benchmark environment
        run: julia --project=benchmark -e 'using Pkg; Pkg.instantiate()'
      - name: Run benchmarks
        run: |
          julia --project=benchmark -e '
            using PkgBenchmark, TransportationPlanningOptimization
            result = benchmarkpkg(TransportationPlanningOptimization)
            export_markdown("benchmark_result.md", result)
            println(sprint(show, result))
          '
      - name: Publish results to job summary
        if: always()
        run: cat benchmark_result.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-result
          path: benchmark_result.md
